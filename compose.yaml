services:
  db:
    image: postgres:17
    container_name: aegispay-db
    environment:
      POSTGRES_DB: aegispay
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_password
    ports:
      - "5433:5432"
    volumes:
      - aegispay_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegispay"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: aegispay-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://aegis:aegis_dev_password@db:5432/aegispay"
    depends_on:
      db:
        condition: service_healthy

  payment-service:
    build: .
    container_name: aegispay-payment-service
    command: uvicorn payment_service:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

volumes:
  aegispay_data:
